; ModHost plugin manifest. Copy the folder (this file + the DLL) to <game>\mods\plugins\HelloPlugin\
[plugin]
; Unique id: letters, digits, '.', '_', '-'. Other plugins depend on this.
id=example.hello
name=Hello Plugin
version=1.0.0
; The Aurie/YYToolkit plugin DLL, relative to this folder.
dll=HelloPlugin.dll
; any (default), vm or yyc
runner=any
; Optional: only load in this game (exe file name, case-insensitive).
;game=DELTARUNE.exe
; Optional: comma-separated ids, each optionally with a minimum version: other.plugin>=1.2
;depends=
; 0 to keep the plugin installed but not loaded.
enabled=1
